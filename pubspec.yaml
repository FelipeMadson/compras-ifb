name: compras
description: "Aplicativo de compras com arquitetura em camadas, persistência relacional SQLite, resiliência a conectividade intermitente e integração nativa Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
